<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test de clic isole</title>
<style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; }
    button { display: block; width: 100%; padding: 1rem; font-size: 1.1rem; margin: 1rem 0; cursor: pointer; }
    #resultat { font-size: 1.1rem; font-weight: bold; margin-top: 1rem; white-space: pre-wrap; }
</style>
</head>
<body>
    <h1>Page de test isolee</h1>
    <p>Cette page ne contient AUCUN script externe, AUCune dependance. Juste un bouton.</p>

    <button onclick="document.getElementById('resultat').textContent = 'TEST 1 REUSSI : le clic fonctionne (onclick inline).';">
        Test 1 : cliquez-moi (onclick inline)
    </button>

    <button onclick="alert('TEST 2 REUSSI : alerte declenchee.');">
        Test 2 : cliquez-moi (alerte)
    </button>

    <button onclick="testerApi();">
        Test 3 : tester la connexion a l'API
    </button>

    <div id="resultat">En attente d'un clic...</div>

    <script>
    function testerApi() {
        var r = document.getElementById('resultat');
        r.textContent = 'Envoi de la requete a /api/auth/login.php ...';
        fetch('/api/auth/login.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ email: 'admin@livraisonci.local', password: 'ChangeMoi123!' })
        }).then(function (res) {
            return res.text().then(function (t) {
                r.textContent = 'HTTP ' + res.status + '\n\nReponse du serveur :\n' + t.slice(0, 500);
            });
        }).catch(function (e) {
            r.textContent = 'ERREUR RESEAU : ' + e.message;
        });
    }
    </script>
</body>
</html>
